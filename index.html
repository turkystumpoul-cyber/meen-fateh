    <style>
      @keyframes livePulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.6);
          opacity: 0.35;
        }
      }
      .live-pulse-dot {
        animation: livePulse 1.4s infinite ease-in-out;
      }
      @keyframes goldShimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .pro-gold-title {
        background: linear-gradient(90deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: goldShimmer 4s linear infinite;
      }
      .founder-gold-name {
        background: linear-gradient(90deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 900;
        animation: goldShimmer 5s linear infinite;
      }
      @keyframes proShimmerSweep {
        0% {
          transform: translateX(150%) skewX(-20deg);
          opacity: 0;
        }
        15% {
          opacity: 0.55;
        }
        45% {
          transform: translateX(-160%) skewX(-20deg);
          opacity: 0;
        }
        100% {
          transform: translateX(-160%) skewX(-20deg);
          opacity: 0;
        }
      }
      .pro-shimmer-sweep {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(252, 246, 186, 0.14) 50%,
          transparent 100%
        );
        animation: proShimmerSweep 4s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-300">
